name: DevSkim

# Controls when the workflow will run
on:
    # Triggers the workflow on push or pull request events but only for the main branch
    push:
        branches: [main]
    pull_request:
        branches: [main]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

    # Run the full validation on a regular cadence (Fridays, 2PM UTC) to catch dependency drift and long-term regressions.
    schedule:
        - cron: '0 14 * * 5'

permissions:
    # Read-only access is enough for this validation workflow.
      actions: read
      contents: read
      security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1.0.3

      - name: Upload DevSkim scan results to GitHub security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: Results_DevSkim.sarif
